utility_template:
  sensor:
    - platform: history_stats
      name: Light On Today
      entity_id: binary_sensor.192_168_2_219
      state: "on"
      type: time
      start: "{{ today_at() }}"
      end: "{{ now() }}"
      state_class: total_increasing
    - platform: history_stats
      name: Light On Yesterday
      entity_id: binary_sensor.192_168_2_219
      state: "on"
      type: time
      start: "{{ today_at() - timedelta(days=1) }}"
      end: "{{ today_at() }}"


  template:
    - binary_sensor:
        - name: "Саша дома"
          state: >
            {{ is_state('device_tracker.poco_x5_pro_5g', 'home') or
               is_state('device_tracker.poco_x5_pro_5g_2', 'home') or
               is_state('device_tracker.poco_x5_pro_5g_3', 'home')
            }}

        - name: "Лена дома"
          state: >
            {{ is_state('device_tracker.xiaomi_11_lite_5g_ne', 'home') or
               is_state('device_tracker.xiaomi_11_lite_5g_ne_2', 'home') or
               is_state('device_tracker.redmi_note_14_pro_5g', 'home') or
               is_state('device_tracker.xiaomi_11_lite_5g_ne_3', 'home')
            }}

    - sensor:
        - name: "sensor.Kotel_Power_Delta"
          state: >
            {{ (
              states('sensor.kotel_power_2')|float(0) -
              states('sensor.kotel_zariad_power')|float(0)
            )|round(2) }}
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement

        - name: "Заряд датчиков"
          unique_id: low_battery_sensor_main
          state: >
            {% set batteries = [
              'sensor.motion_sensor_2_battery_2',
              'sensor.temp1_battery',
              'sensor.temp2_battery',
              'sensor.temp3_battery',
              'sensor.temp4_battery',
              'sensor.temp5_battery',
              'sensor.temp6_battery',
              'sensor.temp7_battery',
              'sensor.door1_battery',
              'sensor.door2_battery',
              'sensor.door3_battery',
              'sensor.door4_battery',
              'sensor.button_battery',
              'sensor.spalnia_shtora_battery_2'
            ] %}
            {% for entity in batteries %}
              {% set val = states(entity) | int(100) %}
              {% if val < 50 %}
                {{ state_attr(entity, 'friendly_name') or entity }}
                {% break %}
              {% endif %}
            {% endfor %}
          icon: mdi:battery-alert
          attributes:
            battery_levels: >
              {% set out = namespace(result=[]) %}
              {% set batteries = [
                'sensor.motion_sensor_2_battery_2',
                'sensor.temp1_battery',
                'sensor.temp2_battery',
                'sensor.temp3_battery',
                'sensor.temp4_battery',
                'sensor.temp5_battery',
                'sensor.temp6_battery',
                'sensor.temp7_battery',
                'sensor.door1_battery',
                'sensor.door2_battery',
                'sensor.door3_battery',
                'sensor.door4_battery',
                'sensor.button_battery',
                'sensor.spalnia_shtora_battery_2'
              ] %}
              {% for entity in batteries %}
                {% set val = states(entity) | int(100) %}
                {% set name = state_attr(entity, 'friendly_name') or entity %}
                {% set out.result = out.result + [name ~ ': ' ~ val ~ '%'] %}
              {% endfor %}
              {{ out.result }}

    - triggers:
        - trigger: state
          entity_id: binary_sensor.192_168_2_219
      sensor:
        - name: Light Previous State Duration
          unique_id: light_previous_state_duration
          default_entity_id: sensor.light_previous_state_duration
          state: >
            {% if trigger.from_state is none or trigger.to_state is none %}
              unknown
            {% else %}
              {% set seconds =
                (as_timestamp(trigger.to_state.last_changed) -
                 as_timestamp(trigger.from_state.last_changed)) | int(0) %}
              {% set days = seconds // 86400 %}
              {% set hours = (seconds % 86400) // 3600 %}
              {% set minutes = (seconds % 3600) // 60 %}
              {% set status = 'Свет был включён'
                if trigger.from_state.state == 'on'
                else 'Света не было' %}
              {% if days > 0 %}
                {{ status }}: {{ days }} д {{ hours }} ч {{ minutes }} мин
              {% else %}
                {{ status }}: {{ hours }} ч {{ minutes }} мин
              {% endif %}
            {% endif %}